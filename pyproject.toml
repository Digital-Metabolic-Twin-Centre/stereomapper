[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereomapper"
version = "1.0.0"
description = "Stereochemistry-aware molecular relationship pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jack McGoldrick", email = "j.mcgoldrick9@universityofgalway.ie" }]

# Adjust these to what you actually need / can install via pip:
dependencies = [
    "pandas",
    "rdkit==2025.3.3",
    "openbabel-wheel==3.1.1.22",
    "numpy==1.26.4",
    "psutil==7.0.0",
    "tqdm==4.67.1",
    "platformdirs==4.3.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "isort>=5.0",
    "pre-commit>=3.0"
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0"
]

[project.scripts]
# Creates a `stereomapper` command that calls stereomapper/cli.py:main
stereomapper = "stereomapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
# If you ship non-.py files (e.g., SQL templates, data), enable one of:
# include-package-data = true

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "N", "UP"]
extend-ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["old", "build", "dist", ".venv", "venv", "env", ".git", "data", "__pycache__"]
addopts = "-ra"
